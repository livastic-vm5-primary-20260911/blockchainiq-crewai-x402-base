[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainiq-crewai-x402-base"
version = "0.1.0"
description = "Independent CrewAI BaseTool with x402 v2 Base USDC paid market brief"
requires-python = ">=3.11"
dependencies = [
    "crewai==1.15.30",
    "x402[requests,evm]==2.25.0",
    "requests>=2.32,<3",
    "pydantic>=2.11,<3",
    "eth-account>=0.13,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
